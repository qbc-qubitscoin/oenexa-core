name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          
      # Go Linting
      - name: golangci-lint (Trading)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: oenexa-trading-service
          
      - name: golangci-lint (Matching)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: oenexa-matching-engine

      # Go Security Scan
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
          
      # Java Linting & Formatting
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
        
      # Java Security Scan (OWASP Dependency Check)
      - name: OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        
      # Unit Tests (Blocks deployment if failed)
      - name: Go Tests (Trading)
        run: cd oenexa-trading-service && go test -v ./...
        
      - name: Go Tests (Matching)
        run: cd oenexa-matching-engine && go test -v ./...
        
      - name: Java Tests (Wallet)
        run: ./gradlew test

  build-and-push:
    needs: quality-and-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Wallet Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.wallet
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/wallet-service:latest
          
      - name: Build and push Trading Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.trading
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/trading-service:latest
          
      - name: Build and push Matching Engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.matching
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/matching-engine:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/oenexa
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
