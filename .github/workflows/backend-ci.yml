name: OENEXA Core Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          
      # Go Linting (Native)
      - name: Go Vet & Fmt (Trading)
        run: |
          cd oenexa-trading-service
          go vet ./...
          FMT_OUT=$(go fmt ./...)
          if [ -n "$FMT_OUT" ]; then
            echo "The following files need formatting:"
            echo "$FMT_OUT"
            exit 1
          fi
          
      - name: Go Vet & Fmt (Matching)
        run: |
          cd oenexa-matching-engine
          go vet ./...
          FMT_OUT=$(go fmt ./...)
          if [ -n "$FMT_OUT" ]; then
            echo "The following files need formatting:"
            echo "$FMT_OUT"
            exit 1
          fi

      # Go Security Scan
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
          
      # Unit Tests (Blocks deployment if failed)
      - name: Go Tests (Trading)
        run: cd oenexa-trading-service && go test -v ./...
        
      - name: Go Tests (Matching)
        run: cd oenexa-matching-engine && go test -v ./...
        
      - name: Java Tests & 100% JaCoCo Coverage Verification
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

  build-and-push:
    needs: quality-and-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Wallet Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.wallet
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/wallet-service:latest
          
      - name: Build and push Trading Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.trading
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/trading-service:latest
          
      - name: Build and push Matching Engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.matching
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/matching-engine:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy docker-compose file to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.SERVER_USER }}/oenexa-core"
          
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/oenexa-core || cd /home/${{ secrets.SERVER_USER }}/oenexa-backend
            # Wait for any apt operations to finish in case of automatic updates
            sleep 5
            # Create network if it doesn't exist
            docker network create oenexa_net || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
